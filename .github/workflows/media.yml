name: Fetch and optimise media

# Downloads the Higgsfield generation results listed in scripts/media/manifest.json,
# writes optimised AVIF/WebP images and compressed MP4/WebM video into public/media,
# and commits the result back to the branch. Run it from the Actions tab or via the API.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated asset ids to process (empty = all pending)"
        required: false
        default: ""
      force:
        description: "Re-process assets that already exist (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install sharp and ffmpeg
        run: npm install --no-save --no-audit --no-fund sharp ffmpeg-static
      - name: Fetch and optimise
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only=${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/media/fetch.mjs $ARGS
      - name: Commit results
        run: |
          git config user.name "lienry-media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git add public/media
          if git diff --cached --quiet; then echo "No media changes"; exit 0; fi
          git commit -m "chore(media): fetch and optimise Higgsfield assets"
          git push origin HEAD:${{ github.ref_name }}
